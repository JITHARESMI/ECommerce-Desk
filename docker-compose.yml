services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_NAME: "Commerce Desk"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env}
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: commerce_desk
      DB_USERNAME: commerce
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      SESSION_SECURE_COOKIE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-template}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerce_desk
      MYSQL_USER: commerce
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - commerce_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  commerce_database:

